[package]
name = "knn_workload_predictor"
version = "0.1.0"
edition = "2021"

# "cdylib" is required to build a Python extension module (.so/.pyd)
# "rlib" is required to let src/main.rs link against this library for Rust benchmarks
[lib]
name = "knn_workload_predictor"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rand = "0.8"
rayon = "1.10"
# PyO3 allows Rust to interface with Python. "extension-module" allows building .so files.
pyo3 = { version = "0.20", features = ["extension-module"] }