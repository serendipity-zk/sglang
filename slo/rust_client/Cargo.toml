[package]
name = "slo_runner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-pickle = "1.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rand = "0.8"
tokenizers = "0.19"
futures = "0.3"
bytes = "1.5"
chrono = "0.4"
anyhow = "1.0"
fdlimit = "0.3"    # To raise OS limits automatically
hf-hub = "0.3"     # For HuggingFace model download
atty = "0.2"       # For TTY detection
